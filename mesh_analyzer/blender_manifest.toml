schema_version = "1.0.0"

id = "mesh_analyzer"
version = "1.0.0"
name = "Mesh Analyzer"
tagline = "Live overlay for tris, n-gons, poles, non-manifold and overlaps"
maintainer = "Matteo Fontana"
type = "add-on"

# Supported: Blender 5.3.x only (max is exclusive). CI tests exactly this range.
blender_version_min = "5.3.0"
blender_version_max = "5.4.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Matteo Fontana"]
tags = ["Mesh", "3D View"]

[build]
paths_exclude_pattern = ["__pycache__/", "/.*", "*.pyc"]
